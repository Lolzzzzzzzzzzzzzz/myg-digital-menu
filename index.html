<style>
:root{
  --bg:#051e22; --gold:#d9b75f; --gold-soft:#b8974a;
  --ink:#f3ecd6; --mute:#9fb3ad; --line:rgba(217,183,95,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--ink);font-family:"Jost",system-ui,sans-serif;font-weight:300;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.frame{max-width:680px;margin:0 auto;padding:0 22px 64px}

/* Hero */
.hero{text-align:center;padding:28px 0 8px}
.hero img{mix-blend-mode:lighten;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);width:100%;max-width:460px;height:auto;display:block;margin:0 auto}
.tagline{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:1.25rem;color:var(--gold);margin-top:6px}
.rule{display:flex;align-items:center;gap:14px;margin:26px auto 0;max-width:320px;color:var(--gold-soft)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.rule i{width:7px;height:7px;transform:rotate(45deg);border:1px solid var(--gold)}

/* Sections */
section{margin-top:54px}
.sec-title{text-align:center;margin-bottom:6px}
.sec-title h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:2.5rem;letter-spacing:.06em;color:var(--gold)}
.sec-title p{font-size:.82rem;color:var(--mute);letter-spacing:.08em;margin-top:2px}
.cols{display:flex;justify-content:flex-end;gap:0;margin:22px 0 4px;padding-bottom:8px;border-bottom:1px solid var(--line);font-size:.78rem;color:var(--mute);letter-spacing:.14em}
.cols span{width:84px;text-align:right}

.item{display:flex;align-items:baseline;gap:12px;padding:15px 0;border-bottom:1px solid rgba(217,183,95,.12)}
.item:last-child{border-bottom:0}
.name{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:1.4rem;line-height:1.2;color:var(--ink)}
.name small{display:block;font-family:"Jost",sans-serif;font-weight:300;font-size:.78rem;color:var(--mute);letter-spacing:.04em;margin-top:2px}
.fill{flex:1}
.price{display:flex;color:var(--gold);font-weight:400;font-size:1.05rem;font-variant-numeric:tabular-nums}
.price span{width:84px;text-align:right}
.single .price span{width:auto}

footer{margin-top:64px;text-align:center}
footer .call{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.5rem;color:var(--ink);margin-top:20px}
footer .call b{color:var(--gold);font-weight:600}
footer small{display:block;margin-top:8px;color:var(--mute);font-size:.78rem;letter-spacing:.06em}

/* One calm entrance */
.hero{animation:rise .9s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.hero{animation:none}}
@media (max-width:420px){.name{font-size:1.25rem}.cols span,.price span{width:70px}.sec-title h2{font-size:2.1rem}}
</style>
